<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Avisos</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <style>
    :root { --bg:#f5f5f7; --card:#fff; --text:#111; --muted:#666; --accent:#2563eb; --danger:#dc2626; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#000; --card:#1c1c1e; --text:#f2f2f7; --muted:#9a9aa0; --accent:#3b82f6; --danger:#ef4444; }
    }
    * { box-sizing: border-box; }
    body { margin:0; padding:1rem; background:var(--bg); color:var(--text);
           font:16px/1.4 -apple-system, system-ui, sans-serif; max-width:640px; margin-inline:auto;
           overflow-x:hidden; -webkit-tap-highlight-color:transparent; }
    #ptr { height:0; overflow:hidden; display:flex; align-items:center; justify-content:center;
           color:var(--muted); font-size:.85rem; transition:height .18s ease; }
    #ptr.pulling { transition:none; }
    h1 { font-size:1.5rem; margin-top:.2rem; }
    button { width:100%; padding:.8rem; font-size:1rem; border:0; border-radius:10px;
             background:var(--accent); color:#fff; margin-bottom:.5rem; cursor:pointer; }
    button:disabled { opacity:.4; cursor:default; }
    #status { color:var(--muted); font-size:.88rem; margin:.2rem 0 .6rem; }
    #status:empty { display:none; }
    ul { list-style:none; padding:0; margin:0; }
    li { position:relative; border-radius:12px; margin-bottom:.6rem; background:transparent;
         overflow:hidden; user-select:none; -webkit-user-select:none; touch-action:pan-y; }
    li.swiping { background:var(--danger); }
    .delete-bg { position:absolute; inset:0; display:flex; align-items:center; padding-left:1rem;
                 color:#fff; font-weight:600; font-size:.9rem; pointer-events:none;
                 opacity:0; visibility:hidden; }
    li.swiping .delete-bg { opacity:1; visibility:visible; }
    .card { position:relative; background:var(--card); border-radius:12px; padding:.8rem 1rem;
            transition:transform .18s ease, opacity .18s ease; }
    .card.dragging { transition:none; will-change:transform; }
    .title { font-weight:600; }
    .body { margin-top:.2rem; word-break:break-word; }
    .time { color:var(--muted); font-size:.8rem; margin-top:.3rem; }
    .empty { text-align:center; color:var(--muted); font-size:.9rem; padding:2rem 0; }
    .footer { display:flex; gap:.5rem; justify-content:center; margin-top:1.2rem; padding:.5rem 0 1.5rem; }
    .btn-sm { width:auto; padding:.45rem .85rem; font-size:.82rem; border-radius:8px;
              background:var(--card); color:var(--muted); margin:0; }
    .btn-sm:active:not(:disabled) { opacity:.7; }
    input { width:100%; padding:.8rem; font-size:1.4rem; letter-spacing:.3em; text-align:center;
            border:1px solid var(--muted); border-radius:10px; background:var(--card); color:var(--text);
            margin-bottom:.5rem; }
    [hidden] { display:none !important; }
  </style>
</head>
<body>
  <div id="ptr"><span id="ptrText">Desliza para actualizar</span></div>
  <h1>Avisos</h1>
  <section id="pair" hidden>
    <p>Escribe el código de 8 dígitos que muestra <code>scripts/tunnel.sh</code> en tu Mac.</p>
    <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="00000000">
    <button id="pairBtn">Vincular</button>
  </section>
  <section id="main" hidden>
    <button id="enable" hidden>Activar notificaciones</button>
  </section>
  <p id="status"></p>
  <ul id="list"></ul>
  <p id="empty" class="empty" hidden>No hay notificaciones</p>
  <footer id="footer" class="footer" hidden>
    <button id="clearAll" class="btn-sm">Borrar todas</button>
    <button id="test" class="btn-sm">Probar (5s)</button>
  </footer>
  <script src="/app.js"></script>
</body>
</html>
